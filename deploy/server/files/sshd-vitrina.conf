# /etc/ssh/sshd_config.d/00-vitrina.conf — installed by provision.sh.
# "00-" so it is read first: sshd keeps the first value it sees, and
# cloud-init's 50-cloud-init.conf may say PasswordAuthentication yes.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
AllowUsers __ADMIN_USER__
