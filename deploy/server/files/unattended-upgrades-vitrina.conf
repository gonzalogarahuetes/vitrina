// /etc/apt/apt.conf.d/52vitrina-unattended — installed by provision.sh.
// Ubuntu's own config already allows the security pocket; this adds the
// PostgreSQL repository (15.x minor releases) and reboots for kernel and
// libc updates, which otherwise wait for a reboot nobody schedules.
// Node is a pinned tarball and never updated here; Caddy is updated by hand.
Unattended-Upgrade::Origins-Pattern {
        "origin=apt.postgresql.org";
};
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
