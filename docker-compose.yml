services:
  vitrina-postgres:
    image: postgres:15
    container_name: vitrina-postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vitrina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vitrina"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.41
    container_name: seaweedfs-s3
    # -volume.max and -master.volumeSizeLimitMB are both load-bearing. Left at
    # their defaults, `weed server` auto-sizes volume slots as free-disk /
    # volume-size (1 GiB each); on a nearly-full dev disk that yields ~4 slots,
    # the default collection claims them all, and every bucket collection is
    # left with no writable volume — PUTs then fail with a 500. 32 × 64 MiB is
    # ample for local test objects and does not depend on host free space.
    command: >
      server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      -volume.max=32 -master.volumeSizeLimitMB=64
    volumes:
      - ./s3-config.json:/etc/seaweedfs/s3.json:ro
      - seaweed-data:/data
    ports:
      - "8333:8333"
    restart: unless-stopped
    # Any HTTP answer, not a successful one: ListBuckets needs credentials and
    # replies 403, which `wget --spider` reads as a failure. What is being
    # tested is that the S3 gateway is serving, which 403 proves.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -S -O /dev/null http://localhost:8333/ 2>&1 | grep -q 'HTTP/1'",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  createbucket:
    image: amazon/aws-cli
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: 10881ccdfa15dda85b360cf10d216988
      AWS_SECRET_ACCESS_KEY: ba68c34138d377ae4522f13c55675c9c
      AWS_DEFAULT_REGION: us-east-1
    # The readiness poll that was here is now seaweedfs's healthcheck, so this
    # runs only once the gateway serves. `head-bucket` stays last: it is this
    # one-shot's verdict, and nothing may come between it and the exit code.
    entrypoint: >
      sh -c '
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://vitrina-media 2>/dev/null || true;
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket vitrina-media
      '
    restart: "no"

  # One-shot, like createbucket: provisions the schema as part of `up`. There
  # is deliberately no way to bring up Postgres without this running.
  migrate:
    image: node:22.14.0-slim # must match NODE_VERSION in .github/workflows/ci.yml
    depends_on:
      vitrina-postgres:
        condition: service_healthy
    working_dir: /repo
    volumes:
      - ./node_modules:/repo/node_modules:ro
      - ./packages/server:/repo/packages/server:ro
    environment:
      DATABASE_URL: postgres://admin:password@vitrina-postgres:5432/vitrina
    command: node packages/server/scripts/migrate.mjs

volumes:
  seaweed-data:
  pgdata:
