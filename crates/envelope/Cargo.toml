[package]
name = "vitrina-envelope"
version = "0.1.0"
edition = "2024"

[dependencies]
blake2 = "0.10.6"
chacha20poly1305 = "0.11.0"
zeroize = "1.9.0"
getrandom = "0.4"
argon2 = "0.6.0"
unicode-normalization = "0.1.25"

[features]
wasm = ["getrandom/wasm_js"]

[dev-dependencies]
base64 = "0.22"
proptest = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27.0"
