<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vitrina — device measurements</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 12px; font: 14px/1.45 -apple-system, system-ui, sans-serif; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      button { font: inherit; padding: 10px 14px; margin: 0 8px 8px 0; }
      pre { white-space: pre-wrap; word-break: break-word; background: #8881; padding: 8px; border-radius: 6px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 4px; }
      #grid img, #album img { width: 100%; height: auto; display: block; }
      #album img { max-width: 320px; }
      .verdict { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Vitrina — device measurements</h1>
    <div>
      <button id="all">Run all</button>
      <button id="a">A · 3 MB</button>
      <button id="b">B · Argon2id</button>
      <button id="c">C · album</button>
      <button id="d">D · thumbnails</button>
      <button id="send">Send log to laptop</button>
    </div>
    <pre id="log">loading…</pre>
    <div id="grid"></div>
    <div id="album"></div>
    <script type="module" src="./run.js"></script>
  </body>
</html>
