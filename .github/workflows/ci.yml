# Vitrina CI —
#
# Two jobs, deliberately separate, and they must stay that way:
#
#   checks — hermetic. No Docker, no network services, no live infrastructure.
#            `pnpm test` is Docker-free on purpose; keep it that way.
#   infra  — brings up the docker-compose stack and talks to a live SeaweedFS
#            S3 gateway. `pnpm test:infra` belongs here and nowhere else.
#
# Do not fold `test:infra` into `test`, and do not merge these jobs. The value
# of a hermetic suite is that a red `checks` means the code is wrong, never
# that a container was slow.
#
# The two jobs do NOT depend on each other. They run in parallel so that a
# failure in one still reports the other's real result.
#
# Action versions are pinned to commit SHAs, not tags — a tag can be moved to
# point at different code, a SHA cannot.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # One place to change the Node version. Matches the version in local use.
  NODE_VERSION: 22.14.0
  # pnpm's version comes from `packageManager` in the root package.json, which
  # corepack reads. Do not name a pnpm version here — one source of truth.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — hermetic. Everything that can be checked without infrastructure.
  # ---------------------------------------------------------------------------
  checks:
    name: checks (hermetic)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, because it needs no toolchain and it is the cheapest way to fail.
      # Non-negotiable #3 as a failing build rather than a line in a document.
      # The check is scoped to crates/ and packages/ — see the script for why a
      # tree-wide grep would match the ban itself and fail forever.
      - name: No forbidden crypto constructions
        run: ./scripts/check-forbidden-constructions.sh

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # corepack must be enabled *after* setup-node so the pnpm shim lands in
      # the bin directory of the Node we just pinned.
      - name: Enable corepack
        run: corepack enable

      # Node stdlib only, no dependencies, so this runs before the install and
      # fails before anything expensive. The documents in spec/ cite each other
      # by section number and those citations go stale; architecture §9 records
      # the case that motivated the check — "non-negotiables #26 and #27" when
      # brief §6 had fifteen items, neither number resolving to anything, found
      # by hand months later. Reads spec/ only, touches no network and no
      # Docker, so it belongs in this job and nowhere else.
      #
      # A red here means a citation that NAMES a document points at nothing in
      # it, or a #N past the end of brief §6's list. Under-specified bare
      # references ("§10.1" meaning the brief's) are printed every run and do
      # not fail: there are two dozen, they are house style rather than defects,
      # and a prose citation must never be what holds up a Rust commit.
      #
      # The severity split lives in the script, deliberately, not in a
      # continue-on-error here — that would also stop a genuinely wrong
      # cross-document citation from failing, which is the one thing this check
      # is for.
      - name: Spec citations resolve
        run: pnpm check:citations

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Must match the wasm-bindgen crate in Cargo.lock exactly; the CLI refuses
      # a mismatched module. A prebuilt release pinned by SHA-256, like actions
      # by commit. The tarball also carries the wasm32 test runner.
      - name: Install wasm-bindgen-cli 0.2.128
        run: |
          curl -sSfL -o wasm-bindgen.tar.gz \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz
          echo "b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f  wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf wasm-bindgen.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" \
            wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen \
            wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen-test-runner
          wasm-bindgen --version

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo test
        run: cargo test

      # `--all-targets` is required, not cosmetic: without it clippy lints only
      # the lib target, so nothing in #[cfg(test)] is linted at all. That is
      # both a coverage hole — test code is code, and `cargo test` only compiles
      # it, it does not lint it — and the source of a misleading dead-code
      # report on crates/envelope, since a field read only from a test appears
      # unread when the tests are not in the compilation. Widening it is a
      # strengthening; do not narrow it to make this step quieter.
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      # C.10 — the envelope suite on the target it ships on. `--features wasm`
      # gives getrandom its browser backend; without it nothing random links.
      # Runs under Node via wasm-bindgen-test-runner, not in a browser.
      - name: cargo test (wasm32-unknown-unknown)
        run: cargo test --target wasm32-unknown-unknown --features wasm
        working-directory: crates/envelope

      # C.10 — builds crates/envelope-wasm and runs every spec/vectors entry
      # through TypeScript (encryption spec §9). Its own script, like
      # test:infra, because it needs a toolchain the JS steps above do not.
      - name: TypeScript smoke harness
        run: pnpm test:wasm

      # Slots for later phases. Do not implement these ahead of their step:
      #   Phase 1  — assert no outbound request carries key material
      #              (invite spec §7 #3)
      # Each is another step in this job; none requires restructuring.

  # ---------------------------------------------------------------------------
  # Job 2 — needs Docker. Verifies the store's Range and presigned-URL support,
  # which the chunked envelope design depends on (encryption spec §3.3).
  # ---------------------------------------------------------------------------
  infra:
    name: infra (docker)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the stack
        run: docker compose up -d

      # `up -d` returns when containers have started, which says nothing about
      # whether the bucket exists. createbucket is a one-shot seeder; poll its
      # real exit status rather than sleeping a guessed number of seconds.
      - name: Wait for the bucket seeder
        run: pnpm infra:wait

      - name: pnpm test:infra
        run: pnpm test:infra

      - name: Dump stack logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down -v
